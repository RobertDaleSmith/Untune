[package]
name = "wavvy"
version = "0.1.0"
description = "A fast, data-dense music player"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "wavvy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.34", features = ["bundled"] }
lofty = "0.22"
walkdir = "2"
rayon = "1"
sha2 = "0.10"
log = "0.4"
dirs = "6"
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
