[package]
name = "waves"
version = "0.1.0"
description = "Waves — a fast, data-dense music player"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "waves_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.34", features = ["bundled"] }
lofty = "0.22"
walkdir = "2"
rayon = "1"
sha2 = "0.10"
log = "0.4"
dirs = "6"
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
base64 = "0.22"
rodio = { version = "0.20", features = ["symphonia-all"] }
symphonia = { version = "0.5", features = ["all"] }
souvlaki = "0.7"
plist = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rustfft = "6"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.24"
objc = "0.2"
