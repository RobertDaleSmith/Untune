name: Untune
options:
  bundleIdPrefix: com.untune
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"

targets:
  Untune:
    type: application
    platform: iOS
    sources:
      - path: Untune
    resources:
      - path: Untune/Resources/SampleAudio
      - path: Untune/Resources/AlternateIcons
    entitlements:
      path: Untune/Untune.entitlements
      properties:
        com.apple.developer.siri: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.untune.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: true
        CODE_SIGN_ENTITLEMENTS: Untune/Untune.entitlements
    dependencies:
      - package: GRDB
      - framework: CarPlay.framework
        embed: false
      - framework: Intents.framework
        embed: false
    info:
      path: Untune/Info.plist
      properties:
        UIBackgroundModes:
          - audio
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.untune.ios.sync
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).CarPlaySceneDelegate"
        INIntentsSupported:
          - INPlayMediaIntent
        INSupportedMediaCategories:
          - INMediaCategoryMusic
        CFBundleIcons:
          CFBundleAlternateIcons:
            Light:
              CFBundleIconFiles:
                - icon-light
              UIPrerenderedIcon: false
            Dark:
              CFBundleIconFiles:
                - icon-dark
              UIPrerenderedIcon: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "Untune needs local network access to discover and sync with your desktop music library."
        NSBonjourServices:
          - "_untune._tcp"
